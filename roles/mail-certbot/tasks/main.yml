---
# certbot is already apt-installed with python3-certbot-nginx plugin (from
# the original emailwiz era). The cert quietly expired because cron-based
# renewal is a no-op under systemd and certbot.timer was never enabled.
# We use the existing nginx authenticator (HTTP-01 via the "mail" vhost on
# port 80) and enable certbot.timer so renewals actually fire.

- name: Ensure deploy-hooks directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: "0755"

- name: Deploy mail reload hook
  ansible.builtin.template:
    src: reload-mail.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-mail.sh
    mode: "0755"

# On a fresh VPS, nginx isn't up yet when this role runs (mail-nginx runs later
# in site-mail.yml), so `--authenticator nginx` cannot complete the HTTP-01
# challenge. Bootstrap via `--standalone` instead (binds certbot's own port-80
# listener; assumes nothing is bound to :80 yet). After issuance, patch the
# renewal config so certbot.timer's daily runs use the nginx authenticator —
# by then nginx is up and owns :80, which would make --standalone collide.
#
# Edge case: if cert is missing AND nginx is already running (manual deletion
# on a running box), the standalone task will fail to bind :80. Stop nginx
# first, then re-run.
- name: Stat existing LE cert
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ mail_hostname }}/fullchain.pem"
  register: le_cert

# Inspect public-key algorithm of the existing leaf so we can one-time-migrate
# legacy RSA-2048 certs to ECDSA P-256. NCSC-NL flags RSA-2048 as "phase out"
# (insufficient in a future revision). ECDSA P-256 is "Sufficient" and triggers
# LE to chain via the E-series ECDSA intermediate (closing the R13/RSA-2048
# intermediate finding at the same time). Empty stdout when no cert exists yet.
- name: Detect public-key algorithm of existing leaf
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -in /etc/letsencrypt/live/{{ mail_hostname }}/cert.pem -noout -text \
      | awk '/Public Key Algorithm:/{print $4; exit}'
  args:
    executable: /bin/bash
  register: le_cert_keyalg
  changed_when: false
  check_mode: false
  when: le_cert.stat.exists

- name: Bootstrap cert with --standalone (fresh box, no cert yet)
  ansible.builtin.command:
    cmd: >
      certbot certonly
      --standalone
      --cert-name {{ mail_hostname }}
      -d {{ mail_hostname }}
      --key-type ecdsa
      --elliptic-curve secp256r1
      --agree-tos
      --email {{ certbot_email }}
      --non-interactive
      --deploy-hook /etc/letsencrypt/renewal-hooks/deploy/reload-mail.sh
  when: not le_cert.stat.exists
  notify:
    - Restart postfix
    - Restart dovecot

# Always reapply so drift is repaired — lineinfile is idempotent. If someone
# manually edits the renewal conf (or it ever resets to standalone), the next
# play restores the nginx authenticator. Only ever runs if the renewal conf
# already exists (i.e. cert has been issued at some point — bootstrap creates
# it, fresh-install runs without a cert skip via failed_when on absence).
- name: Patch renewal config to use nginx authenticator
  ansible.builtin.lineinfile:
    path: "/etc/letsencrypt/renewal/{{ mail_hostname }}.conf"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^authenticator\s*=', line: "authenticator = nginx" }
    - { regexp: '^installer\s*=', line: "installer = nginx" }
  failed_when: false   # renewal conf doesn't exist yet on a never-issued box

- name: Renew mail cert via nginx HTTP-01 (no-op if not yet near expiry)
  ansible.builtin.command:
    cmd: >
      certbot certonly
      --authenticator nginx
      --installer nginx
      --cert-name {{ mail_hostname }}
      -d {{ mail_hostname }}
      --key-type ecdsa
      --elliptic-curve secp256r1
      --agree-tos
      --email {{ certbot_email }}
      --non-interactive
      --keep-until-expiring
      --deploy-hook /etc/letsencrypt/renewal-hooks/deploy/reload-mail.sh
  register: certbot_run
  changed_when: "'no action taken' not in certbot_run.stdout"
  when: le_cert.stat.exists
  notify:
    - Restart postfix
    - Restart dovecot

# One-time migration: if the existing leaf is RSA, force-renew as ECDSA P-256.
# --keep-until-expiring above would otherwise leave the cert alone for ~80 days
# until it neared expiry. The flag combination (--key-type ecdsa
# --force-renewal) tells certbot to discard the existing key material and
# re-issue with the new algorithm. Becomes a no-op once the leaf is ECDSA.
- name: Migrate legacy RSA leaf to ECDSA P-256 (one-time)
  ansible.builtin.command:
    cmd: >
      certbot certonly
      --authenticator nginx
      --installer nginx
      --cert-name {{ mail_hostname }}
      -d {{ mail_hostname }}
      --key-type ecdsa
      --elliptic-curve secp256r1
      --agree-tos
      --email {{ certbot_email }}
      --non-interactive
      --force-renewal
      --deploy-hook /etc/letsencrypt/renewal-hooks/deploy/reload-mail.sh
  when:
    - le_cert.stat.exists
    - le_cert_keyalg.stdout | default('') == 'rsaEncryption'
  notify:
    - Restart postfix
    - Restart dovecot

# /etc/cron.d/certbot is gated by `! -d /run/systemd/system` so it's a no-op
# on systemd boxes — the actual renewal driver is certbot.timer, which the
# apt package ships disabled by default. This is the root cause of the
# 6-week-expired cert.
- name: Enable and start certbot.timer
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started
