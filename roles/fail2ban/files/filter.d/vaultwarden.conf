# Fail2Ban filter: Vaultwarden failed login attempts.
#
# Sample MESSAGE field as emitted by the container:
#   [2026-05-03 12:22:11.790][vaultwarden::api::identity][ERROR] Username or password is incorrect. Try again. IP: 90.167.94.173. Username: foo@example.com.
#
# When fail2ban's systemd backend reads journald, it synthesises a logline by
# prepending `<_HOSTNAME> <_COMM>[<_PID>]: ` to the MESSAGE. The leading `.*`
# in the regex below absorbs that prefix; the IP we want is the one Vaultwarden
# itself logged (real client IP via the IP_HEADER=X-Real-IP env from nginx).

[Definition]

failregex = ^.*\[vaultwarden::api::identity\]\[ERROR\] Username or password is incorrect\..*IP: <HOST>\.

ignoreregex =
