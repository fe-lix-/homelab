# Fail2Ban filter: nginx 444 responses (recon scanner block).
#
# Sample MESSAGE field as emitted by the container:
#   45.135.193.157 - - [13/May/2026:03:52:35 +0200] "GET /.env HTTP/1.1" 444 0 "-" "Mozilla/5.0 ..."
#
# When fail2ban's systemd backend reads journald, it synthesises a logline by
# prepending `<_HOSTNAME> <_COMM>[<_PID>]: ` to the MESSAGE — e.g.:
#   kazaddum c0b52dfacd60[4031501]: 45.135.193.157 - - [...] "GET ..." 444 0 ...
# A naïve `^<HOST>` regex captures the hostname (kazaddum → 127.0.1.1) and the
# event gets dropped by `ignoreself`. The leading `^.*:\s+` skips that prefix
# so <HOST> binds to the actual client IP.
#
# Status 444 is non-standard — nginx-only, set by `return 444;` in our
# block_dotfile_recon() macro for any URI starting with `/.` (except
# /.well-known/, exempt for Authelia OIDC discovery). A legitimate client
# never receives 444 from this nginx config, so any IP racking up several of
# them is a scanner and safe to ban.

[Definition]

failregex = ^.*:\s+<HOST>\s+-\s+-\s+\[[^\]]+\]\s+"[^"]+"\s+444\s+\d+

ignoreregex =
