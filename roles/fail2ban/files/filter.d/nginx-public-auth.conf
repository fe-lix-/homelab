# Fail2Ban filter: brute-force on the public token endpoints.
#
#   shop.delval.eu -> a wrong/missing kids-page key returns 403 on /kids*
#   kobo.delval.eu -> a wrong/missing Komga API key returns 403 (Komga) on /kobo/*
# (match 401 too, defensively — some Komga versions/paths answer 401.)
#
# These URIs are only reachable from the internet on those two dedicated public
# hosts (the LAN comics./manga-scheduler. vhosts are local_guard'd, and the LAN
# is whitelisted via ignoreip in jail.local), so any match here is an outsider
# guessing a token — safe to ban after a few tries.
#
# systemd backend: fail2ban prepends "<_HOSTNAME> <_COMM>[<_PID>]: " to the
# container MESSAGE, so the leading `^.*:\s+` skips that prefix and binds <HOST>
# to the real client IP (nginx runs host-networked, so $remote_addr is the
# genuine client — no proxy in front).

[Definition]

failregex = ^.*:\s+<HOST>\s+-\s+-\s+\[[^\]]+\]\s+"(?:GET|POST|HEAD)\s+/kids[^"]*"\s+(?:401|403)\s
            ^.*:\s+<HOST>\s+-\s+-\s+\[[^\]]+\]\s+"(?:GET|HEAD)\s+/kobo/[^"]*"\s+(?:401|403)\s

ignoreregex =
