---
- name: Create books-kobo data directory
  ansible.builtin.file:
    path: "{{ books_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download kepubify binary
  ansible.builtin.get_url:
    url: "{{ books_kepubify_url }}"
    dest: "{{ books_kepubify_bin }}"
    mode: "0755"
    owner: root
    group: root

- name: Pull lightnovel-crawler image (scraper runtime)
  community.docker.docker_image:
    name: "{{ books_scraper_image }}"
    source: pull
    state: present

- name: Deploy novel scraper script
  ansible.builtin.template:
    src: novel-scraper.py.j2
    dest: "{{ books_data_dir }}/novel-scraper.py"
    owner: root
    group: root
    mode: "0755"

- name: Deploy scrape-novel wrapper
  ansible.builtin.template:
    src: scrape-novel.sh.j2
    dest: "{{ books_data_dir }}/scrape-novel.sh"
    owner: root
    group: root
    mode: "0755"

- name: Deploy kepubify converter script
  ansible.builtin.template:
    src: kepubify-converter.py.j2
    dest: "{{ books_data_dir }}/kepubify-converter.py"
    owner: root
    group: root
    mode: "0755"

- name: Deploy kepubify-converter systemd service
  ansible.builtin.template:
    src: kepubify-converter.service.j2
    dest: /etc/systemd/system/kepubify-converter.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy kepubify-converter systemd timer
  ansible.builtin.template:
    src: kepubify-converter.timer.j2
    dest: /etc/systemd/system/kepubify-converter.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start kepubify-converter timer
  ansible.builtin.systemd:
    name: kepubify-converter.timer
    enabled: true
    state: started
