---
- name: Look up komf (komga) user
  ansible.builtin.getent:
    database: passwd
    key: "{{ komf_user }}"

- name: Look up groups (for komf write-group gids)
  ansible.builtin.getent:
    database: group

- name: Set komf uid/gid facts
  ansible.builtin.set_fact:
    komf_uid: "{{ ansible_facts['getent_passwd'][komf_user][1] }}"
    komf_gid: "{{ ansible_facts['getent_passwd'][komf_user][2] }}"

- name: Create komf directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ komf_uid }}"
    group: "{{ komf_gid }}"
    mode: "0755"
  loop:
    - "{{ komf_data_dir }}"
    - "{{ komf_data_dir }}/config"

- name: Deploy komf application config
  ansible.builtin.template:
    src: application.yml.j2
    dest: "{{ komf_data_dir }}/config/application.yml"
    owner: "{{ komf_uid }}"
    group: "{{ komf_gid }}"
    mode: "0600"
  no_log: true
  notify: Restart komf

- name: Deploy komf docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ komf_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart komf

- name: Start komf
  community.docker.docker_compose_v2:
    project_src: "{{ komf_data_dir }}"
    state: present
