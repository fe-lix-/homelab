---
- name: Install archive extractors (p7zip + unrar for RAR-method .cbr that 7z can't decode)
  ansible.builtin.apt:
    name:
      - p7zip-full
      - unrar
    state: present

- name: Install Xvfb (headed browser for Fireload's reCAPTCHA runs under a virtual display)
  ansible.builtin.apt:
    name: xvfb
    state: present

- name: Install python3-venv
  ansible.builtin.apt:
    name: python3-venv
    state: present

- name: Create manga-downloader virtualenv
  ansible.builtin.command:
    cmd: python3 -m venv {{ manga_scheduler_data_dir }}/venv
    creates: "{{ manga_scheduler_data_dir }}/venv/bin/python"

- name: Install Python dependencies for manga-downloader
  ansible.builtin.pip:
    name:
      - playwright
    virtualenv: "{{ manga_scheduler_data_dir }}/venv"

- name: Install Playwright Chromium browser
  ansible.builtin.command:
    cmd: "{{ manga_scheduler_data_dir }}/venv/bin/playwright install --with-deps chromium"
  environment:
    # Install into the service's own data dir, not /root/.cache. The downloader
    # runs under the UI service's ProtectHome=yes sandbox, which hides /root.
    PLAYWRIGHT_BROWSERS_PATH: "{{ manga_scheduler_data_dir }}/ms-playwright"
  register: playwright_install
  changed_when: "'downloaded' in playwright_install.stdout.lower()"

- name: Create manga-scheduler data directory
  ansible.builtin.file:
    path: "{{ manga_scheduler_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate kids-mode magic-link key (once; never regenerated)
  # 128-bit (32 hex chars): the /kids page is now internet-facing (kobo.delval.eu),
  # so the key must be brute-infeasible on its own — the rate-limit + fail2ban are
  # a second layer, not the only one. It's a bookmark, so length doesn't hurt UX.
  # Delete the file + re-run to rotate.
  ansible.builtin.shell: "umask 077 && openssl rand -hex 16 > {{ manga_scheduler_data_dir }}/kids-key.txt"
  args:
    creates: "{{ manga_scheduler_data_dir }}/kids-key.txt"

- name: Deploy token-grant key (from vault; shared with the Home Assistant rest_command)
  ansible.builtin.copy:
    content: "{{ vault_manga_scheduler_grant_key }}\n"
    dest: "{{ manga_scheduler_data_dir }}/grant-key.txt"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Create manga-downloader staging directory
  ansible.builtin.file:
    path: "{{ manga_downloader_staging_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy manga-scheduler script
  ansible.builtin.template:
    src: manga-scheduler.py.j2
    dest: "{{ manga_scheduler_data_dir }}/manga-scheduler.py"
    owner: root
    group: root
    mode: "0700"

- name: Deploy manga-downloader script
  ansible.builtin.template:
    src: manga-downloader.py.j2
    dest: "{{ manga_scheduler_data_dir }}/manga-downloader.py"
    owner: root
    group: root
    mode: "0700"

- name: Deploy manga-scheduler systemd service
  ansible.builtin.template:
    src: manga-scheduler.service.j2
    dest: /etc/systemd/system/manga-scheduler.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy manga-scheduler systemd timer
  ansible.builtin.template:
    src: manga-scheduler.timer.j2
    dest: /etc/systemd/system/manga-scheduler.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Disable manga-scheduler timer (deliveries are token-driven via the UI, not automatic)
  ansible.builtin.systemd:
    name: manga-scheduler.timer
    enabled: false
    state: stopped

- name: Deploy manga-scheduler UI server
  ansible.builtin.template:
    src: manga-scheduler-ui.py.j2
    dest: "{{ manga_scheduler_data_dir }}/manga-scheduler-ui.py"
    owner: root
    group: root
    mode: "0700"
  notify: Restart manga-scheduler-ui

- name: Deploy manga-scheduler UI systemd service
  ansible.builtin.template:
    src: manga-scheduler-ui.service.j2
    dest: /etc/systemd/system/manga-scheduler-ui.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start manga-scheduler-ui service
  ansible.builtin.systemd:
    name: manga-scheduler-ui.service
    enabled: true
    state: started

# --- Auto-updater ---

- name: Deploy manga-auto-update script
  ansible.builtin.template:
    src: manga-auto-update.py.j2
    dest: "{{ manga_scheduler_data_dir }}/manga-auto-update.py"
    owner: root
    group: root
    mode: "0700"

- name: Deploy manga-auto-update systemd service
  ansible.builtin.template:
    src: manga-auto-update.service.j2
    dest: /etc/systemd/system/manga-auto-update.service
