---
manga_scheduler_upload_dir: /srv/uploads/mangas
manga_scheduler_comics_dir: /srv/comics
manga_scheduler_data_dir: /opt/manga-scheduler
manga_scheduler_target_pages: 150
manga_scheduler_schedule: "*-*-* 04,16:00:00"   # twice daily (04:00 + 16:00)
manga_scheduler_ui_port: 5010

# --- Token economy ---
# Deliveries are on-demand and cost tokens (no automatic drip). Each UI member
# accrues this many tokens per calendar day (unlimited accumulation). Members of
# manga_scheduler_admin_group deliver for free.
manga_scheduler_tokens_per_day: 1
# Per-user daily-accrual overrides (username -> tokens/day); everyone else gets
# manga_scheduler_tokens_per_day. Both case variants accrue as separate records
# (Authelia forward-auth capitalises; the kids page uses the lowercase name).
# Currently none — everyone (non-admin) gets the default 1/day.
manga_scheduler_tokens_per_day_overrides: {}
manga_scheduler_admin_group: admin

# Kids mode: a low-friction magic-link page (for e-ink Kobo browsers) that maps a
# secret URL key to this Authelia identity, so the kid can spend their own tokens
# without an Authelia login. The key is generated on the server (kids-key.txt) and
# never leaves it. LAN-only (the vhost's local_guard covers /kids too).
manga_scheduler_kids_user: emma

manga_downloader_delay: 30
manga_downloader_staging_dir: "{{ manga_scheduler_data_dir }}/staging"
manga_scheduler_ntfy_url: "http://127.0.0.1:{{ ntfy_port }}"
manga_scheduler_ntfy_topic: "manga"
manga_scheduler_ntfy_token: ""  # set in vault: vault_manga_scheduler_ntfy_token

# --- Chapter checker (gallery-dl) ---
manga_chapter_checker_schedule: "*-*-* 06:00:00"
manga_chapter_checker_manga: []
#   - url: https://fmteam.fr/comics/blue-lock
#     series_name: Blue Lock
#     ntfy_topic: manga-bluelock
