---
- name: Create Home Assistant directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ homeassistant_data_dir }}"
    - "{{ homeassistant_data_dir }}/config"
    - "{{ homeassistant_data_dir }}/patches"

- name: Deploy patched aiopvpc pvpc_tariff.py (adds missing 2026 holiday data)
  ansible.builtin.copy:
    src: aiopvpc_pvpc_tariff.py
    dest: "{{ homeassistant_data_dir }}/patches/pvpc_tariff.py"
    mode: "0644"
  notify: Restart homeassistant

- name: Configure Home Assistant to trust nginx reverse proxy
  ansible.builtin.blockinfile:
    path: "{{ homeassistant_data_dir }}/config/configuration.yaml"
    marker: "# {mark} ANSIBLE MANAGED - reverse proxy"
    block: |
      http:
        use_x_forwarded_for: true
        trusted_proxies:
          - 127.0.0.1
    create: true
    mode: "0644"
  notify: Restart homeassistant

- name: Add Emma's token-grant command under Home Assistant rest_command
  # Merge into the existing (live-edited) rest_command: mapping — a second
  # top-level rest_command: key would be invalid. Lets an HA tag/automation give
  # Emma a token via the manga-scheduler UI (localhost only; 5010 =
  # manga_scheduler_ui_port). Key from the vault, matching grant-key.txt.
  ansible.builtin.blockinfile:
    path: "{{ homeassistant_data_dir }}/config/configuration.yaml"
    marker: "  # {mark} ANSIBLE MANAGED - manga token grant"
    insertafter: '^rest_command:$'
    block: "  emma_grant_token:\n    url: \"http://127.0.0.1:5010/grant\"\n    method: POST\n    content_type: \"application/x-www-form-urlencoded\"\n    payload: \"key={{ vault_manga_scheduler_grant_key }}&user=emma&n=1\""
    mode: "0644"
  no_log: true
  notify: Restart homeassistant

- name: Deploy Home Assistant docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homeassistant_data_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart homeassistant

- name: Start Home Assistant
  community.docker.docker_compose_v2:
    project_src: "{{ homeassistant_data_dir }}"
    state: present
