---
- name: Create nutrition-mcp directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ nutrition_mcp_base_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ nutrition_mcp_base_dir }}/data", owner: "1000", group: "1000", mode: "0700"}
    - {path: "{{ nutrition_mcp_base_dir }}/data/backups", owner: "1000", group: "1000", mode: "0700"}
    - {path: "{{ nutrition_mcp_base_dir }}/secrets", owner: root, group: root, mode: "0700"}
    - {path: "{{ nutrition_mcp_base_dir }}/garmin", owner: "1000", group: "1000", mode: "0700"}


- name: Deploy nutrition-mcp .env
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ nutrition_mcp_base_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart nutrition-mcp

- name: Deploy nutrition-mcp docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nutrition_mcp_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart nutrition-mcp

- name: Write OIDC client secret
  ansible.builtin.copy:
    content: "{{ nutrition_mcp_oidc_client_secret }}"
    dest: "{{ nutrition_mcp_base_dir }}/secrets/oidc_client_secret"
    owner: "1000"
    group: "1000"
    mode: "0400"
  no_log: true
  notify: Restart nutrition-mcp

- name: Write sync token
  ansible.builtin.copy:
    content: "{{ nutrition_mcp_sync_token }}"
    dest: "{{ nutrition_mcp_base_dir }}/secrets/sync_token"
    owner: "1000"
    group: "1000"
    mode: "0400"
  no_log: true
  notify: Restart nutrition-mcp

- name: Start nutrition-mcp
  community.docker.docker_compose_v2:
    project_src: "{{ nutrition_mcp_base_dir }}"
    pull: always
    build: never
    state: present

- name: Wait for nutrition-mcp healthz
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nutrition_mcp_port }}/healthz"
    status_code: 200
  register: _healthz
  until: _healthz.status == 200
  retries: 15
  delay: 4
