---
- name: Validate junimoserver secrets
  ansible.builtin.assert:
    that:
      - junimoserver_steam_username | length > 0
      - junimoserver_steam_password | length > 0
      - junimoserver_vnc_password | length > 0
    fail_msg: >-
      Set junimoserver_steam_username, junimoserver_steam_password, and
      junimoserver_vnc_password in inventories/production/group_vars/all/vault.yml
      before deploying the junimoserver role.

- name: Create junimoserver directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ junimoserver_data_dir }}"
    - "{{ junimoserver_data_dir }}/game"
    - "{{ junimoserver_data_dir }}/saves"
    - "{{ junimoserver_data_dir }}/settings"
    - "{{ junimoserver_data_dir }}/steam-session"

- name: Deploy junimoserver docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ junimoserver_data_dir }}/docker-compose.yml"
    mode: "0640"
  no_log: true
  notify: Restart junimoserver

- name: Deploy junimoserver server-settings.json
  ansible.builtin.template:
    src: server-settings.json.j2
    dest: "{{ junimoserver_data_dir }}/settings/server-settings.json"
    mode: "0644"
  notify: Restart junimoserver

- name: Start junimoserver
  community.docker.docker_compose_v2:
    project_src: "{{ junimoserver_data_dir }}"
    state: present
  ignore_errors: "{{ ansible_check_mode }}"
