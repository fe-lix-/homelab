---
# JunimoServer pins to :preview because sdvd/steam-service does NOT publish a
# `latest` tag on Docker Hub — only `preview` and `1.5.0-preview.*` versions.
# Upstream's compose only works with `latest` because it has a `build:`
# directive that falls back to local build; we pull pre-built images. The
# README itself recommends `preview` for stability ("often contains fixes
# that haven't been officially released yet").
junimoserver_version: "preview"
junimoserver_vnc_port: 5800
junimoserver_api_port: 8080
junimoserver_game_port: 24642
junimoserver_query_port: 27015
junimoserver_data_dir: /opt/junimoserver
# Set to true to skip game rendering for ~30-40% lower CPU/RAM. With rendering
# disabled the noVNC admin UI shows a black screen — the game runs headless
# and you control it via the HTTP API on port {{ junimoserver_api_port }}.
# Leave false during initial farm setup, flip to true once the farm is
# configured and being managed via the API.
junimoserver_disable_rendering: true
# Toggle verbose logging in junimoserver. Useful when debugging connection
# issues (player joins, SDR/Galaxy handshakes, lobby state changes). Leave
# off in steady state — it's chatty.
junimoserver_verbose_logging: false

# server-settings.json — Ansible owns this file. Changes made via the in-game
# admin UI or chat commands will be overwritten on the next deploy. Edit
# values here instead. Full reference:
# https://stardew-valley-dedicated-server.github.io/server/admins/configuration/server-settings.html
#
# Game.* settings apply ONLY at farm creation — they're ignored for existing
# saves. Server.* settings apply on every startup (and some are toggleable
# in-game via chat commands).

# --- Game.* (farm-creation only) ---
junimoserver_farm_name: "Junimo"
# FarmType: 0=Standard, 1=Riverland, 2=Forest, 3=Hilltop, 4=Wilderness,
# 5=Four Corners, 6=Beach, 7=Meadowlands
junimoserver_farm_type: 0
# ProfitMargin must be one of: 0.25, 0.5, 0.75, 1.0 (price multiplier;
# 1.0=normal, 0.25=very hard / sell prices reduced)
junimoserver_profit_margin: 1.0
junimoserver_starting_cabins: 1
# SpawnMonstersAtNight: "auto", "true", "false"
junimoserver_spawn_monsters: "auto"

# --- Server.* (runtime, applied on every startup) ---
junimoserver_max_players: 10
# CabinStrategy: "CabinStack" (cabins overlap on a single tile),
# "FarmhouseStack" (cabins overlap on the farmhouse), or "None" (vanilla)
junimoserver_cabin_strategy: "CabinStack"
# Per-player money & inventory. Toggleable in-game via the !changewallet
# chat command, but this file is the persistent source of truth.
junimoserver_separate_wallets: true
# ExistingCabinBehavior: "KeepExisting" (leave visible cabins where they are)
# or "MoveToStack" (relocate existing cabins into the stack)
junimoserver_existing_cabin_behavior: "KeepExisting"
# Allow direct IP joins (in addition to Steam SDR / Galaxy P2P). Upstream
# warns this may cause farmhand-ownership issues.
junimoserver_allow_ip_connections: false
# LobbyMode: "Shared" (one lobby visible to all) or "Individual"
junimoserver_lobby_mode: "Shared"
junimoserver_active_lobby_layout: "default"
# Steam IDs (as strings) auto-granted admin chat-command access in-game
junimoserver_admin_steam_ids: []

# Secrets — set in vault.yml (use `make vault-edit`)
junimoserver_steam_username: ""   # set in vault: junimoserver_steam_username
junimoserver_steam_password: ""   # set in vault: junimoserver_steam_password
junimoserver_vnc_password: ""     # set in vault: junimoserver_vnc_password
