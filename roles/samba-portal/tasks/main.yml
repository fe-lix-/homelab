---
- name: Create samba-portal service user
  ansible.builtin.user:
    name: "{{ samba_portal_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create samba-portal data directory
  ansible.builtin.file:
    path: "{{ samba_portal_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy privileged Samba helper
  ansible.builtin.template:
    src: samba-helper.py.j2
    dest: "{{ samba_portal_data_dir }}/samba-helper.py"
    owner: root
    group: root
    mode: "0755"

- name: Deploy portal web service
  ansible.builtin.template:
    src: samba-portal.py.j2
    dest: "{{ samba_portal_data_dir }}/samba-portal.py"
    owner: root
    group: root
    mode: "0755"
  notify: Restart samba-portal

- name: Deploy sudoers rule for the portal
  ansible.builtin.template:
    src: samba-portal-sudoers.j2
    dest: /etc/sudoers.d/samba-portal
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Deploy samba-portal systemd unit
  ansible.builtin.template:
    src: samba-portal.service.j2
    dest: /etc/systemd/system/samba-portal.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart samba-portal

- name: Enable and start samba-portal
  ansible.builtin.systemd:
    name: samba-portal.service
    enabled: true
    state: started
    daemon_reload: true
